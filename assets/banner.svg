<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">phtevenDOT</title>
  <desc id="desc">Catppuccin Mocha dotfiles for Neovim, tmux, Zsh, and Hyprland. A dark terminal-inspired wordmark with lavender and mint accents.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#surface)"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="#313244"/>
  <path d="M48 64H1232" stroke="#313244"/>
  <g fill="#6c7086">
    <circle cx="56" cy="35" r="5"/>
    <circle cx="76" cy="35" r="5"/>
    <circle cx="96" cy="35" r="5"/>
  </g>
  <text x="1232" y="40" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="12" letter-spacing="3">PHTEVEN / DOTFILES</text>
  <text x="60" y="128" fill="#a6e3a1" font-family="monospace" font-size="13" letter-spacing="3">MAKE YOURSELF AT HOME.</text>
  <text x="54" y="225" fill="#cdd6f4" font-family="monospace" font-size="80" font-weight="700" letter-spacing="-5">phteven<tspan fill="url(#accent)">DOT</tspan><tspan fill="#a6e3a1">.</tspan></text>
  <text x="60" y="267" fill="#a6adc8" font-family="monospace" font-size="17">Good colors. Real tabs. Keys that feel right.</text>
  <g transform="translate(830 106)">
    <rect width="390" height="185" rx="12" fill="#181825" stroke="#313244"/>
    <text x="24" y="38" fill="#6c7086" font-family="monospace" font-size="12">~/phtevenDOT</text>
    <path d="M24 55H366" stroke="#313244"/>
    <text x="24" y="94" fill="#cba6f7" font-family="monospace" font-size="18">❯ <tspan fill="#cdd6f4">nvim .</tspan></text>
    <text x="24" y="130" fill="#a6adc8" font-family="monospace" font-size="14">one repo. your environment.</text>
    <rect x="24" y="151" width="12" height="3" rx="1" fill="#a6e3a1"/>
  </g>
  <path d="M60 324H1220" stroke="#313244"/>
  <text x="60" y="365" fill="#bac2de" font-family="monospace" font-size="14" letter-spacing="1">NEOVIM  /  TMUX  /  ZSH  /  HYPRLAND</text>
  <g transform="translate(1075 354)">
    <circle cx="0" cy="6" r="6" fill="#cba6f7"/>
    <circle cx="24" cy="6" r="6" fill="#89b4fa"/>
    <circle cx="48" cy="6" r="6" fill="#a6e3a1"/>
    <circle cx="72" cy="6" r="6" fill="#f9e2af"/>
    <circle cx="96" cy="6" r="6" fill="#f38ba8"/>
  </g>
</svg>
