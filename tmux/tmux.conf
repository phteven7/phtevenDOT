# Reload the configuration with prefix + r.
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Prefix: Control-Space.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Modern terminal behavior.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g history-limit 100000
set -g mouse on

# Start numbering at one and close numbering gaps automatically.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane navigation and splits that inherit the current directory.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Make resizing quick and predictable.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 5

# Names and terminal titles.
# Manual window names stay put; applications cannot silently replace them.
set -g automatic-rename off
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#{session_name}:#{window_index} #{window_name}"

# Prompt with the current name when renaming a session or window, then redraw.
bind '$' command-prompt -I "#S" -p "rename session:" "rename-session '%%'" \; refresh-client -S
bind ',' command-prompt -I "#W" -p "rename window:" "rename-window '%%'" \; refresh-client -S

# Status bar fundamentals.
set -g status-position top
set -g status-interval 2
set -g status-left-length 60
set -g status-right-length 120
set -g status-justify left

# Catppuccin Mocha: clear contrast, compact rounded tabs.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g @catppuccin_date_time_text " %a %b %d  %H:%M"
set -g @catppuccin_session_text " #S"

# Load the theme before assembling its status modules.
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Keep the session name visible on the left; context and time sit on the right.
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Copy mode should feel like Vim.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
